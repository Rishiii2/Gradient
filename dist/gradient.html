<title>Gradient</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gradient: a personalised, past-paper-driven study planner for university exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: an exam-prep workbench. A quiet ruled-paper ground, ink-blue actions, and one loud element:
   the highlighter heat scale that marks where the marks are. Left rail on desktop, bottom tabs on phones. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --sunk: #eceef3; --ink: #151a26; --muted: #5a6476; --faint: #8a93a3; --line: #dde1e9;
  --accent: #2b48c4; --accent-ink: #ffffff; --accent-soft: #e6ebfb;
  --good: #1b7f52; --good-soft: #e1f3ea; --warn: #a86400; --warn-soft: #fbefd9; --bad: #b8322a; --bad-soft: #f9e3e1;
  --heat0: #f7f4ea; --heat1: #fde9a6; --heat2: #fbcf5a; --heat3: #f29a2e; --heat4: #d4581d; --heat5: #9c2f12;
  --h2-ink: #2b1b00; --h3-ink: #2b1200; --h4-ink: #fff8f0; --h5-ink: #fff8f0;
  --m0: #f1e3e1; --m1: #f6d3a8; --m2: #e9e3a0; --m3: #b9dcb0; --m4: #8fcca8; --m5: #5fb489;
  --shadow: 0 1px 2px rgba(20, 26, 40, .06), 0 8px 24px rgba(20, 26, 40, .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-sm: 6px; --r-md: 10px;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #161b25; --sunk: #1d2330; --ink: #e7ebf2; --muted: #a0a9b8; --faint: #6f7888; --line: #2a3140;
    --accent: #8ea2f5; --accent-ink: #0f131b; --accent-soft: #232c4a;
    --good: #5cc795; --good-soft: #17322a; --warn: #f0b552; --warn-soft: #3a2c14; --bad: #f08a80; --bad-soft: #3d1f1e;
    --heat0: #1d2029; --heat1: #3b3418; --heat2: #6e5715; --heat3: #a8691c; --heat4: #d9792b; --heat5: #f5a65a;
    --h2-ink: #fff1d6; --h3-ink: #1a0d05; --h4-ink: #1a0d05; --h5-ink: #1a0d05;
    --m0: #3a2222; --m1: #4a3418; --m2: #45441c; --m3: #24442f; --m4: #1d5c3e; --m5: #237a52;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #161b25; --sunk: #1d2330; --ink: #e7ebf2; --muted: #a0a9b8; --faint: #6f7888; --line: #2a3140;
  --accent: #8ea2f5; --accent-ink: #0f131b; --accent-soft: #232c4a;
  --good: #5cc795; --good-soft: #17322a; --warn: #f0b552; --warn-soft: #3a2c14; --bad: #f08a80; --bad-soft: #3d1f1e;
  --heat0: #1d2029; --heat1: #3b3418; --heat2: #6e5715; --heat3: #a8691c; --heat4: #d9792b; --heat5: #f5a65a;
  --h2-ink: #fff1d6; --h3-ink: #1a0d05; --h4-ink: #1a0d05; --h5-ink: #1a0d05;
  --m0: #3a2222; --m1: #4a3418; --m2: #45441c; --m3: #24442f; --m4: #1d5c3e; --m5: #237a52;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 700; }
h2 { font-size: 22px; font-weight: 650; }
h3 { font-size: 17px; font-weight: 620; }
h4 { font-size: 14px; font-weight: 620; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.grid3.keep3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
.grid-dash { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-dash { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- shell ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; gap: 12px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; }
.brand svg { width: 26px; height: 26px; }
.uni-chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.top-search { flex: 1 1 auto; max-width: 420px; position: relative; }
.top-search input { width: 100%; height: 36px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 0 12px 0 34px; }
.top-search svg { position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; color: var(--faint); }
.top-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 8px; cursor: pointer; color: var(--muted); position: relative; }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 650; font-size: 13px; }
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100% - 56px); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 10px; position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); height: calc(100vh - 56px); overflow-y: auto; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail .group { margin: 14px 10px 6px; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14.5px; }
.nav-link svg { width: 18px; height: 18px; flex: none; }
.nav-link:hover { background: var(--sunk); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.main-inner { max-width: 1180px; margin: 0 auto; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { color: var(--muted); max-width: 68ch; margin-top: 6px; }
.tabbar { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .uni-chip, .top-search { display: none; }
  .main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 8px; min-width: 56px; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--accent); }
}

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel { background: var(--sunk); border-radius: var(--r-md); padding: 14px 16px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.banner { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; }
.banner.info { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); background: var(--warn-soft); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--bad-soft); }
.banner.good { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); background: var(--good-soft); }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 560; cursor: pointer; text-decoration: none; white-space: nowrap; font-size: 14.5px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 46px; padding: 0 22px; font-size: 16px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 560; color: var(--ink); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12.5px; color: var(--bad); }
.input, select.input, textarea.input { width: 100%; min-height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.5; }
.input[aria-invalid="true"] { border-color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--sunk); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 540; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 560; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 560; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); white-space: nowrap; }
.chip.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip svg { width: 13px; height: 13px; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }

/* ---------- data display ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); } .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.grade { font-family: var(--display); font-weight: 700; font-size: 20px; }
.legend { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }

/* heatmap */
.heat { display: grid; grid-template-columns: 170px repeat(4, minmax(0, 1fr)); gap: 6px; }
.heat .unit { font-size: 13px; color: var(--muted); padding: 8px 8px 8px 0; display: flex; flex-direction: column; justify-content: center; }
.heat .unit b { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.cell { border: 0; border-radius: 8px; padding: 9px 10px; text-align: left; cursor: pointer; min-height: 78px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; color: var(--ink); font-size: 13px; line-height: 1.3; position: relative; }
.cell .nm { font-weight: 560; overflow-wrap: anywhere; }
.cell .mk { font-family: var(--mono); font-size: 12px; display: flex; justify-content: space-between; gap: 6px; opacity: .92; }
.cell.h0 { background: var(--heat0); color: var(--ink); } .cell.h1 { background: var(--heat1); color: var(--ink); } .cell.h2 { background: var(--heat2); color: var(--h2-ink); }
.cell.h3 { background: var(--heat3); color: var(--h3-ink); } .cell.h4 { background: var(--heat4); color: var(--h4-ink); } .cell.h5 { background: var(--heat5); color: var(--h5-ink); }
.cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell .pet { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
@media (max-width: 760px) { .heat { grid-template-columns: repeat(2, minmax(0, 1fr)); } .heat .unit { grid-column: 1 / -1; padding: 10px 0 0; } }
.mcell { border-radius: 7px; padding: 8px; font-size: 12.5px; min-height: 58px; border: 0; text-align: left; cursor: pointer; color: var(--ink); }
.mcell.m0 { background: var(--m0); } .mcell.m1 { background: var(--m1); } .mcell.m2 { background: var(--m2); } .mcell.m3 { background: var(--m3); } .mcell.m4 { background: var(--m4); } .mcell.m5 { background: var(--m5); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .35); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 61; border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: slide .18s ease-out; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-body { padding: 16px 18px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } * { scroll-behavior: auto !important; transition: none !important; } }

/* toasts */
.toasts { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 9px; font-size: 14px; box-shadow: var(--shadow); pointer-events: auto; }
@media (max-width: 860px) { .toasts { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); } }

/* plan items */
.plan-day { display: flex; flex-direction: column; gap: 8px; }
.plan-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.plan-item:first-child { border-top: 0; }
.plan-item.done .t { text-decoration: line-through; color: var(--muted); }
.plan-item .t { font-weight: 580; }
.plan-item .mins { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.kind { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
.kind.study { color: var(--accent); } .kind.review { color: var(--good); } .kind.exam { color: var(--bad); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: .06em; }
.cal .d { min-height: 64px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 6px; font-size: 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.cal .d.off { background: transparent; border-style: dashed; color: var(--faint); cursor: default; }
.cal .d.exam { border-color: var(--bad); background: var(--bad-soft); }
.cal .d.today { outline: 2px solid var(--accent); outline-offset: -1px; }
.cal .d .load { height: 4px; border-radius: 4px; background: var(--accent); opacity: .85; }
.cal .d[aria-pressed="true"] { background: var(--accent-soft); }

/* chat */
.chat { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1020px) { .chat { grid-template-columns: minmax(0, 1fr); } }
.msgs { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 760px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; border-radius: 14px 14px 14px 4px; }
.msg.bot p + p { margin-top: 8px; }

@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }

details.faq { border-bottom: 1px solid var(--line); padding: 14px 0; }

.footer { padding-block: 32px 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }

.prose { max-width: 72ch; display: flex; flex-direction: column; gap: 12px; }

/* loader */

.boot-step.ok { color: var(--ink); }
.boot-step i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.boot-step.ok i { background: var(--good); border-color: var(--good); }
.boot-step.run i { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { background: linear-gradient(90deg, var(--sunk), var(--line), var(--sunk)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; }
@keyframes sh { to { background-position: -200% 0; } }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.chart text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
svg.chart .ax { stroke: var(--line); }
.graph-node { cursor: pointer; }

    const key = profId + "|" + (code || "*");
    D._fpCache = D._fpCache || {};
    if (D._fpCache[key]) return D._fpCache[key];
    const qs = D.pyqs.filter((q) => q.prof === profId && (!code || q.course === code));
    const courseQs = code ? D.pyqs.filter((q) => q.course === code) : null;
    const style = { n: 0, d: 0, t: 0 }; let diff = 0, rep = 0;
    const unitMarks = [0, 0, 0, 0, 0], courseUnit = [0, 0, 0, 0, 0];
    const conceptFreq = {};
    for (const q of qs) {
      style[q.style]++; diff += q.difficulty; if (q.repeatOf) rep++;
      if (q.type === "end") for (const c of q.concepts) unitMarks[D.conceptById[c].unit] += q.marks / q.concepts.length;
      for (const c of q.concepts) conceptFreq[c] = (conceptFreq[c] || 0) + 1;
    }
    if (courseQs) for (const q of courseQs) if (q.type === "end") for (const c of q.concepts) courseUnit[D.conceptById[c].unit] += q.marks / q.concepts.length;
    const n = qs.length;
    const us = unitMarks.reduce((a, b) => a + b, 0) || 1, cs = courseUnit.reduce((a, b) => a + b, 0) || 1;
    const unitShare = unitMarks.map((x) => x / us);
    const unitRatio = code ? unitMarks.map((x, i) => (x / us) / Math.max(0.02, courseUnit[i] / cs)) : unitShare.map(() => 1);
    const fav = Object.entries(conceptFreq).filter(([, f]) => f >= 2).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, f]) => ({ id, f }));
    const fp = {
      prof: profId, course: code, n, papers: new Set(qs.map((q) => q.paper)).size,
      style: { n: style.n / (n || 1), d: style.d / (n || 1), t: style.t / (n || 1) },
      difficulty: n ? diff / n : null, repeatRate: n ? rep / n : null,
      unitShare, unitRatio, favourites: fav,
      topUnit: unitShare.indexOf(Math.max(...unitShare)),
      confidence: n < 15 ? "low" : n < 45 ? "medium" : "high",
      enough: n >= 10,
    };
    D._fpCache[key] = fp;
    return fp;
  };

  // ---------- Mastery: Bayesian knowledge tracing + forgetting curve ----------
  const BKT = { learn: 0.15, slip: 0.1, guess: 0.25 };
  G.BKT = BKT;
  G.bktUpdate = function (m, correct, guess = BKT.guess) {
    const post = correct ? (m * (1 - BKT.slip)) / (m * (1 - BKT.slip) + (1 - m) * guess) : (m * BKT.slip) / (m * BKT.slip + (1 - m) * (1 - guess));
    return Math.min(0.995, post + (1 - post) * BKT.learn);
  };
  G.selfRate = (m, rating) => 0.65 * m + 0.35 * ((rating - 1) / 4);
  G.studyGain = (m, minutes, tau) => 1 - (1 - m) * Math.exp(-minutes / tau);
  G.retrievability = (daysSince, stability) => Math.exp(-Math.max(0, daysSince) / Math.max(0.5, stability));
  G.tau = function (D, id, masteryOf) {
    const k = D.conceptById[id];
    let t = 22 + 13 * k.difficulty;
    if (k.prereqs.length) {
      const pm = k.prereqs.map((p) => masteryOf(p)).filter((x) => x != null);
      if (pm.length && pm.reduce((a, b) => a + b, 0) / pm.length < 0.5) t *= 1.35;
    }
    return t;
  };

  // ---------- Adaptive quiz from the concept graph ----------
  G.makeQuiz = function (D, profile, rng, n = 6, focusCourse) {
    const pool = [];
    for (const code of profile.courses) {
      if (focusCourse && code !== focusCourse) continue;
      const map = G.examMap(D, code, profile.profs[code], { branch: profile.branch });
      for (const r of map.rows) {
        const m = profile.mastery[r.id];
        const info = m * (1 - m); // most informative near 0.5
        pool.push({ id: r.id, w: (info + 0.05) * (0.5 + r.E / 7) });
      }
    }
    const picked = [];
    while (picked.length < n && pool.length) {
      const i = rng.weighted(pool.map((p) => p.w));
      picked.push(pool.splice(i, 1)[0].id);
    }
    const acc = profile.recentAccuracy == null ? 0.6 : profile.recentAccuracy;
    return picked.map((id, qi) => {
      const k = D.conceptById[id], course = D.courseByCode[k.course];
      const hard = acc > 0.7;
      const sameUnit = course.units[k.unit].conceptIds.filter((x) => x !== id);
      const otherUnits = course.conceptIds.filter((x) => D.conceptById[x].unit !== k.unit);
      const dpool = hard ? sameUnit.concat(rng.shuffle(otherUnits.slice()).slice(0, 1)) : rng.shuffle(otherUnits.slice()).slice(0, 3).concat(sameUnit.slice(0, 1));
      const distract = rng.shuffle(dpool.slice()).slice(0, 3);
      const kind = qi % 2 === 0 ? "describe" : "identify";
      const opts = rng.shuffle([id, ...distract]).map((x) => ({ id: x, text: kind === "describe" ? cap(D.conceptById[x].gist) : D.conceptById[x].name }));
      const prompt = kind === "describe" ? `Which statement correctly describes ${k.name}?` : `“${cap(k.gist)}.” Which topic is this?`;
      return { concept: id, course: k.course, kind, prompt, options: opts, answer: id, difficulty: hard ? "hard" : "standard" };
    });
  };
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ---------- Grade predictor ----------
  G.normCdf = function (x) {
    const t = 1 / (1 + 0.2316419 * Math.abs(x));
    const d = 0.3989423 * Math.exp(-x * x / 2);
    const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return x > 0 ? 1 - p : p;
  };
  G.gradeFor = function (D, total) { for (const [g, t] of D.university.grading.grades) if (total >= t) return g; return "F"; };
  G.threshold = (D, grade) => (D.university.grading.grades.find((g) => g[0] === grade) || ["P", 40])[1];
  // predicted end-sem raw score (out of 70) for a mastery vector, and P(reaching a grade)
  G.predictCourse = function (D, map, masteryOf, marks, targetGrade) {
    const g = D.university.grading;
    let mu = 0, v = 0;
    for (const r of map.rows) { const m = masteryOf(r.id); mu += r.E * m; v += r.E * r.E * m * (1 - m) * 0.5; }
    const sd = Math.sqrt(v + 20);
    const sofar = marks.internal + marks.mid;
    const needFor = (grade) => (G.threshold(D, grade) - sofar) * g.endPaper / g.endWeight;
    const pFor = (grade) => { const need = needFor(grade); if (need > g.endPaper) return 0; if (need <= 0) return 1; return 1 - G.normCdf((need - mu) / sd); };
    const expectedTotal = sofar + mu * g.endWeight / g.endPaper;
    return { mu, sd, sofar, expectedTotal, expectedGrade: G.gradeFor(D, expectedTotal), need: needFor(targetGrade), pTarget: pFor(targetGrade), pPass: pFor("P"), pFor, needFor };
  };

  // ---------- Marks-per-hour planner ----------
  // Blocks of BLOCK minutes. The k-th block on concept c is worth E_c (1-m_c)(e^{-(k-1)B/τ} - e^{-kB/τ}) expected marks,
  // a diminishing sequence, so concepts are concave. Unit-length jobs with deadlines (each course's exam) form a
  // scheduling matroid, so taking blocks greedily by value while keeping the deadline system feasible is optimal for
  // that relaxation. Prerequisite order and spaced reviews are then enforced when blocks are laid onto days.
  const BLOCK = 25;
  G.PLAN_BLOCK = BLOCK;
  G.plan = function (D, profile, opts = {}) {
    const today = startOfDay(opts.today || G.today());
    const daily = Math.max(15, Math.round((profile.dailyHours || 2) * 60));
    const reviewShare = opts.noReviews ? 0 : 0.15;
    const courses = profile.courses.map((code) => ({ code, exam: startOfDay(new Date(profile.examDates[code])), prof: profile.profs[code] }));
    const lastExam = Math.max(...courses.map((c) => c.exam.getTime()));
    const days = [];
    for (let t = today.getTime(); t < lastExam; t += 864e5) days.push(new Date(t));
    if (!days.length) return { days: [], items: [], blocks: 0, totalGain: 0, summary: "All exams are over." };
    const dayIdx = (date) => Math.round((startOfDay(date).getTime() - today.getTime()) / 864e5);
    const missed = new Set(profile.missedDays || []);
    // minutes already checked off today come out of today's budget
    const usedToday = (profile.doneLog || []).filter((x) => x.date === isoDate(today)).reduce((s, x) => s + x.minutes, 0);
    const cap = days.map((d, i) => {
      if (missed.has(isoDate(d))) return 0;
      const isExamDay = courses.some((c) => c.exam.getTime() === d.getTime());
      const mins = (isExamDay ? daily * 0.4 : daily) - (i === 0 ? usedToday : 0);
      return Math.max(0, Math.floor(mins * (1 - reviewShare) / BLOCK));
    });
    const masteryOf = (id) => profile.mastery[id];
    const maps = {}; const weightMult = {};
    for (const c of courses) {
      maps[c.code] = opts.maps ? opts.maps[c.code] : G.examMap(D, c.code, c.prof, { branch: profile.branch });
      weightMult[c.code] = 1;
      if (!opts.pureMarks && profile.targets && profile.marks[c.code]) {
        const pr = G.predictCourse(D, maps[c.code], masteryOf, profile.marks[c.code], profile.targets[c.code] || "A");
        if (pr.pTarget < 0.5 && pr.need <= 70) weightMult[c.code] = 1.25;   // marks here move the grade you asked for
        else if (pr.pTarget > 0.97) weightMult[c.code] = 0.85;
      }
    }
    // candidate concepts with their deadline = last study day before that course's exam
    const deadlineOf = {};
    const cands = [];
    for (const c of courses) {
      const dl = Math.min(days.length, dayIdx(c.exam)); // blocks must be on days < exam day
      for (const r of maps[c.code].rows) {
        const m = masteryOf(r.id); if (m == null) continue;
        deadlineOf[r.id] = dl;
        cands.push({ id: r.id, course: c.code, E: r.E * weightMult[c.code], Eraw: r.E, m0: m, tau: G.tau(D, r.id, masteryOf), k: 0, dl });
      }
    }
    // a prerequisite must be started before its dependents, so it inherits the earliest dependent deadline
    const candById = Object.fromEntries(cands.map((c) => [c.id, c]));
    for (let changed = true; changed;) {
      changed = false;
      for (const c of cands) for (const p of D.conceptById[c.id].prereqs) {
        const pc = candById[p];
        if (pc && pc.dl > c.dl) { pc.dl = c.dl; deadlineOf[p] = c.dl; changed = true; }
      }
    }
    const gainOf = (c, k) => c.E * (1 - c.m0) * (Math.exp(-(k - 1) * BLOCK / c.tau) - Math.exp(-k * BLOCK / c.tau));
    // deadline feasibility: for every deadline d, blocks due by d must fit into capacity of days [0, d)
    const prefixCap = []; let acc = 0; for (let i = 0; i < cap.length; i++) { acc += cap[i]; prefixCap.push(acc); }
    const capBefore = (d) => d <= 0 ? 0 : prefixCap[Math.min(d, cap.length) - 1];
    const dls = [...new Set(cands.map((c) => c.dl))].sort((a, b) => a - b);
    const usedBy = Object.fromEntries(dls.map((d) => [d, 0]));
    const feasibleWith = (dl) => { let cum = 0; for (const d of dls) { cum += usedBy[d] + (d === dl ? 1 : 0); if (cum > capBefore(d)) return false; } return true; };
    // max-heap of next-block gains
    const heap = [];
    const push = (x) => { heap.push(x); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p].g >= heap[i].g) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
    const pop = () => { const top = heap[0]; const last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l].g > heap[m].g) m = l; if (r < heap.length && heap[r].g > heap[m].g) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
    for (const c of cands) push({ c, g: gainOf(c, 1) });
    const chosen = [];
    while (heap.length) {
      const { c, g } = pop();
      if (g < 0.004) break;
      if (!feasibleWith(c.dl)) continue; // this deadline is full; its later blocks are worth less, so drop the concept
      usedBy[c.dl]++; c.k++;
      chosen.push({ id: c.id, course: c.course, k: c.k, gain: g / weightMult[c.course], dl: c.dl });
      push({ c, g: gainOf(c, c.k + 1) });
    }
    // lay blocks onto days: highest value first, prerequisites first, never break remaining feasibility
    const byConcept = {};
    for (const b of chosen) (byConcept[b.id] = byConcept[b.id] || []).push(b);
    const remaining = new Map(Object.entries(byConcept).map(([id, bs]) => [id, bs.slice().sort((a, b) => a.k - b.k)]));
    const firstDay = {};
    const remDue = {}; for (const b of chosen) remDue[b.dl] = (remDue[b.dl] || 0) + 1;
    const sched = days.map(() => []);
    for (let di = 0; di < days.length; di++) {
      let slots = cap[di];
      const perConceptToday = {};
      while (slots > 0) {
        let best = null;
        for (const [id, bs] of remaining) {
          if (!bs.length) continue;
          const b = bs[0];
          if (b.dl <= di) continue;
          const pre = D.conceptById[id].prereqs.filter((p) => remaining.has(p) && firstDay[p] == null);
          if (pre.length) continue;
          if ((perConceptToday[id] || 0) >= 3) continue;
          // urgency: blocks whose deadline is close must go first if capacity is tight
          if (!best || b.gain > best.gain) best = b;
        }
        // feasibility guard: if some deadline would become impossible, take its block instead
        let forced = null;
        let cum = 0;
        for (const d of dls) {
          cum += remDue[d] || 0;
          let capLeft = slots; for (let j = di + 1; j < Math.min(d, days.length); j++) capLeft += cap[j];
          if (cum >= capLeft && (remDue[d] || 0) > 0) { forced = d; break; }
        }
        if (forced != null) {
          let fb = null;
          for (const [id, bs] of remaining) {
            if (!bs.length || bs[0].dl > forced || bs[0].dl <= di) continue;
            const blocked = D.conceptById[id].prereqs.some((p) => remaining.has(p) && firstDay[p] == null);
            if (blocked) continue;
            if (!fb || bs[0].gain > fb.gain) fb = bs[0];
          }
          if (fb) best = fb;
        }
        if (!best) break;
        remaining.get(best.id).shift();
        remDue[best.dl]--;
        if (firstDay[best.id] == null) firstDay[best.id] = di;
        perConceptToday[best.id] = (perConceptToday[best.id] || 0) + 1;
        sched[di].push(best);
        slots--;
      }
    }
    // spaced reviews in the reserved share: +1, +4 and +10 days after first study, before the exam
    const reviewCap = days.map((d, i) => cap[i] === 0 ? 0 : Math.floor(((courses.some((c) => c.exam.getTime() === d.getTime()) ? daily * 0.4 : daily) * reviewShare) / 10));
    const reviews = days.map(() => []);
    if (!opts.noReviews) {
      for (const [id, d0] of Object.entries(firstDay)) {
        for (const off of [1, 4, 10]) {
          const di = d0 + off;
          if (di < days.length && di < deadlineOf[id] && reviews[di].length < reviewCap[di]) reviews[di].push(id);
        }
      }
    }
    // build human-readable items
    const out = days.map((d, di) => {
      const items = [];
      const grouped = {};
      for (const b of sched[di]) { if (!grouped[b.id]) { grouped[b.id] = { id: b.id, course: b.course, minutes: 0, gain: 0, firstBlock: b.k }; items.push(grouped[b.id]); } grouped[b.id].minutes += BLOCK; grouped[b.id].gain += b.gain; }
      const studyItems = items.map((it) => {
        const lastBlockOfConcept = !(remaining.get(it.id) || []).length && Object.values(sched).slice(di + 1).every((s) => !s.some((b) => b.id === it.id));
        return Object.assign(it, { kind: "study", why: G.planWhy(D, maps[it.course], it, profile), practice: lastBlockOfConcept ? G.practiceFor(D, it.id, it.course, 2) : [] });
      });
      const revItems = reviews[di].map((id) => ({ kind: "review", id, course: D.conceptById[id].course, minutes: 10, gain: 0, why: "Spaced review so it is still fresh on exam day." }));
      const examsToday = courses.filter((c) => c.exam.getTime() === d.getTime()).map((c) => c.code);
      return { date: isoDate(d), items: studyItems.concat(revItems), exams: examsToday, capacity: cap[di] * BLOCK };
    });
    // mastery after following the plan, counting only blocks that were actually placed on a day
    const placed = {}; let totalGain = 0, placedBlocks = 0;
    for (const day of sched) for (const b of day) { placed[b.id] = (placed[b.id] || 0) + 1; totalGain += b.gain; placedBlocks++; }
    const after = Object.assign({}, profile.mastery);
    for (const [id, n] of Object.entries(placed)) after[id] = G.studyGain(profile.mastery[id], n * BLOCK, candById[id].tau);
    return { days: out, blocks: placedBlocks, totalGain, masteryAfter: after, maps, firstDay, block: BLOCK };
  };
  G.planWhy = function (D, map, it, profile) {
    const r = map.byId[it.id]; const k = D.conceptById[it.id];
    const m = Math.round(profile.mastery[it.id] * 100);
    const years = new Set((D.pyqsByConcept[it.id] || []).filter((q) => q.course === map.course && q.type === "end").map((q) => q.year)).size;
    return `Worth about +${it.gain.toFixed(1)} marks: the end-sem carries ~${r.E.toFixed(1)} marks on it (asked ${years} of 5 years) and your mastery is ${m}%.`;
  };
  G.practiceFor = function (D, id, code, n) {
    return (D.pyqsByConcept[id] || []).filter((q) => q.course === code && !q.repeatOf).sort((a, b) => b.year - a.year || b.marks - a.marks).slice(0, n).map((q) => q.id);
  };

  // naive baseline: syllabus order, equal time per concept, courses studied in exam order
  G.chapterOrderPlanGain = function (D, profile, trueE, totalMinutes) {
    const ids = [];
    const codes = profile.courses.slice().sort((a, b) => new Date(profile.examDates[a]) - new Date(profile.examDates[b]));
    const per = Math.max(BLOCK, Math.floor(totalMinutes / codes.length / BLOCK) * BLOCK);
    let gain = 0;
    for (const code of codes) {
      const course = D.courseByCode[code];
      let left = per;
      for (const id of course.conceptIds) {
        if (left <= 0) break;
        const t = Math.min(left, 2 * BLOCK);
        const m0 = profile.mastery[id];
        gain += trueE[id] * (G.studyGain(m0, t, G.tau(D, id, (x) => profile.mastery[x])) - m0);
        left -= t; ids.push(id);
      }
    }
    return gain;
  };

  // ---------- Panic mode ----------
  G.panic = function (D, KB, profile, code, hours) {
    const map = G.examMap(D, code, profile.profs[code], { branch: profile.branch });
    const blocks = Math.max(1, Math.floor(hours * 60 / 15));
    const st = map.rows.map((r) => ({ r, m: profile.mastery[r.id], tau: G.tau(D, r.id, (x) => profile.mastery[x]), k: 0 }));
    const g = (s, k) => s.r.E * (1 - s.m) * (Math.exp(-(k - 1) * 15 / s.tau) - Math.exp(-k * 15 / s.tau));
    for (let i = 0; i < blocks; i++) {
      let best = null, bg = 0;
      for (const s of st) { const v = g(s, s.k + 1); if (v > bg) { bg = v; best = s; } }
      if (!best) break; best.k++;
    }
    const picks = st.filter((s) => s.k > 0).sort((a, b) => (b.r.E * (1 - b.m)) - (a.r.E * (1 - a.m)));
    const skip = st.filter((s) => s.k === 0).sort((a, b) => a.r.E - b.r.E).slice(0, 5);
    return {
      map, gain: picks.reduce((s, p) => s + p.r.E * (G.studyGain(p.m, p.k * 15, p.tau) - p.m), 0),
      items: picks.map((p) => {
        const k = D.conceptById[p.r.id];
        const chunk = KB.chunks.filter((c) => c.verified && c.concepts.includes(p.r.id)).sort((a, b) => b.quality - a.quality)[0] || null;
        return { id: p.r.id, minutes: p.k * 15, E: p.r.E, m: p.m, gist: k.gist, chunk: chunk ? chunk.id : null, pyqs: G.practiceFor(D, p.r.id, code, 2) };
      }),
      skip: skip.map((s) => s.r.id),
    };
  };

  // ---------- Faculty aggregates (k-anonymous) ----------
  G.MIN_COHORT = 10;
  G.facultyView = function (D, profId) {
    const out = [];
    for (const code of D.profById[profId].courses) {
      const course = D.courseByCode[code];
      const sections = [];
      for (const b of course.branches) for (const L of D.sectionLetters) {
        if (D.sectionProf(code, b, L, D.currentYear) !== profId) continue;
        const year = Math.ceil(course.sem / 2);
        const studs = D.students.filter((s) => s.branch === b && s.section === L && s.year === year && s.mastery[code]);
        if (!studs.length) continue;
        const map = G.examMap(D, code, profId, { branch: b });
        const unitMeans = course.units.map((u) => {
          if (studs.length < G.MIN_COHORT) return null;
          let s = 0, n = 0;
          for (const st of studs) u.conceptIds.forEach((cid) => { s += st.mastery[code][course.conceptIds.indexOf(cid)]; n++; });
          return s / n;
        });
        let atRisk = 0;
        for (const st of studs) {
          const pr = G.predictCourse(D, map, (cid) => st.mastery[code][course.conceptIds.indexOf(cid)], st.marks[code], "P");
          if (pr.pPass < 0.5) atRisk++;
        }
        const conceptMeans = course.conceptIds.map((cid, j) => ({ id: cid, mean: studs.reduce((s, st) => s + st.mastery[code][j], 0) / studs.length, E: map.byId[cid] ? map.byId[cid].E : 0 }));
        sections.push({ key: `${b}-${L}`, n: studs.length, unitMeans, atRisk: studs.length >= G.MIN_COHORT ? atRisk : null, weak: conceptMeans.sort((a, b2) => (a.mean - a.E / 20) - (b2.mean - b2.E / 20)).slice(0, 5) });
      }
      if (sections.length) out.push({ code, sections });
    }
    return out;
  };

  // ---------- dates ----------
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function isoDate(d) { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }
  G.startOfDay = startOfDay; G.isoDate = isoDate;
  G.today = function () { return G._today ? new Date(G._today) : new Date(); };
  // academic calendar: odd-semester end-sem exams run in December
  G.examCalendar = function (codes) {
    const now = G.today();
    let year = now.getFullYear();
    if (now > new Date(year, 11, 14)) year++;
    const slots = [1, 3, 5, 8, 10, 12].map((d) => isoDate(new Date(year, 11, d)));
    const out = {};
    codes.forEach((c, i) => { out[c] = slots[i % slots.length]; });

              ${missed ? `<button class="btn sm" data-act="unmiss">Undo missed day</button>` : `<button class="btn sm" data-act="missToday">${A.icon("refresh")}I can't study today</button>`}</div>

            ${doneToday.length ? `<div class="stack" style="gap:4px;margin-top:10px"><div class="label">Done today</div>${doneToday.map((x) => `<div class="row small muted">${A.icon("check")}<span>${esc(A.cname(x.id))} · ${x.minutes} min</span></div>`).join("")}</div>` : ""}

  A.planItem = function (it, i, interactive) {

  Object.assign(A.actions, {

  // ---------- Exam map ----------
  A.views.map = function (arg) {
    const d = D(), p = P();
    const code = arg && p.courses.includes(arg) ? arg : (S.ui.mapCourse && p.courses.includes(S.ui.mapCourse) ? S.ui.mapCourse : p.courses[0]);
    S.ui.mapCourse = code;

    const course = d.courseByCode[code];
    const pid = p.profs[code];
    const map = A.map(code, pid, type);
    const max = Math.max(...map.rows.map((r) => r.E));
    const units = type === "end" ? course.units : course.units.slice(0, 3);

    const top = map.rows.slice(0, 8);

          <label class="field" style="min-width:230px"><span class="small">Paper set by</span><select class="input" data-change="setProf" data-code="${code}">${course.profPool.map((x) => `<option value="${x}" ${x === pid ? "selected" : ""}>${esc(d.profById[x].name)}</option>`).join("")}</select></label></div>

      <div class="grid2" style="margin-top:16px">

          <p class="small muted">In a backtest that hid 2025, the top 10 concepts per paper covered ${S.evalsCache ? pct(S.evalsCache.examMap.ours) : "about two-thirds"} of that year's marks. <a href="#quality">See the full report</a>.</p>
        </section>
      </div>` };
  };
  Object.assign(A.actions, {
    mapCourse: (el) => { S.ui.mapCourse = el.dataset.code; location.hash = "map-" + el.dataset.code; },
    mapType: (el) => { S.ui.mapType = el.dataset.t; A.render(); },

  // ---------- Planner ----------
  A.views.planner = function () {
    const d = D(), p = P(), plan = A.plan();
    const view = S.ui.planView || "list";
    const showAll = S.ui.planAll;
    const days = plan.days.filter((x) => x.items.length || x.exams.length);
    const shown = showAll ? days : days.slice(0, 10);
    const studyMin = plan.days.reduce((s, x) => s + x.items.reduce((a, i) => a + i.minutes, 0), 0);
    let body;
    if (view === "list") {
      body = `<div class="stack">${shown.map((day) => `<section class="card plan-day"><div class="row-between"><h3>${A.dateLabel(day.date, { weekday: "long" })}${day.date === todayISO() ? ` <span class="chip accent">Today</span>` : ""}</h3><span class="small muted num">${day.items.reduce((s, i) => s + i.minutes, 0)} min · +${fmt1(day.items.reduce((s, i) => s + i.gain, 0))} marks</span></div>
        ${day.exams.map((c) => `<div class="banner bad">${A.icon("warn")}<div><b>Exam today:</b> ${esc(A.courseName(c))}</div></div>`).join("")}
        <div>${day.items.map((it, i) => A.planItem(it, i, false)).join("")}</div></section>`).join("")}
        ${days.length > 10 ? `<button class="btn" data-act="planAll">${showAll ? "Show fewer days" : `Show all ${days.length} days`}</button>` : ""}</div>`;
    } else {
      const start = new Date(plan.days[0].date + "T00:00:00");
      const end = new Date(plan.days[plan.days.length - 1].date + "T00:00:00");
      const byDate = Object.fromEntries(plan.days.map((x) => [x.date, x]));
      const examDates = new Set(Object.values(p.examDates));
      const months = [];
      for (let m = new Date(start.getFullYear(), start.getMonth(), 1); m <= end || months.length === 0; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) { months.push(new Date(m)); if (months.length > 4) break; }
      const sel = S.ui.calDay && byDate[S.ui.calDay] ? S.ui.calDay : plan.days[0].date;
      body = `<div class="grid-dash"><div class="stack">${months.map((m) => {
        const first = new Date(m.getFullYear(), m.getMonth(), 1); const lead = (first.getDay() + 6) % 7; const n = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
        let cells = ""; for (let i = 0; i < lead; i++) cells += `<div></div>`;
        for (let dd = 1; dd <= n; dd++) {
          const iso = G.isoDate(new Date(m.getFullYear(), m.getMonth(), dd)); const day = byDate[iso]; const ex = examDates.has(iso);
          const mins = day ? day.items.reduce((s, i) => s + i.minutes, 0) : 0;
          cells += day || ex ? `<button class="d ${ex ? "exam" : ""} ${iso === todayISO() ? "today" : ""}" aria-pressed="${iso === sel}" data-act="calDay" data-d="${iso}" aria-label="${A.dateLabel(iso)}: ${mins} minutes${ex ? ", exam" : ""}"><span class="num">${dd}</span>${ex ? `<span class="tiny" style="color:var(--bad);font-weight:600">Exam</span>` : ""}${mins ? `<span class="load" style="width:${Math.min(100, mins / (p.dailyHours * 60) * 100)}%"></span><span class="tiny muted num">${mins}m</span>` : ""}</button>` : `<div class="d off"><span class="num">${dd}</span></div>`;
        }
        return `<section class="card"><h3 style="margin-bottom:10px">${m.toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</h3><div class="cal">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((x) => `<div class="dow">${x}</div>`).join("")}${cells}</div></section>`;
      }).join("")}</div>
      <section class="card"><h3>${A.dateLabel(sel, { weekday: "long" })}</h3>${byDate[sel] && byDate[sel].items.length ? byDate[sel].items.map((it, i) => A.planItem(it, i, false)).join("") : `<p class="small muted" style="margin-top:8px">Nothing planned.</p>`}</section></div>`;
    }
    return { title: "Study plan", html: `
      ${A.head("Study plan", `${plan.blocks} study blocks of ${plan.block} minutes (${Math.round(studyMin / 60)} hours) until your last exam, worth about +${fmt1(plan.totalGain)} expected marks. It rebuilds after every check-off, quiz and missed day.`)}
      <div class="row-between" style="margin-bottom:16px">
        <div class="seg" role="group" aria-label="Plan view">${[["list", "List"], ["calendar", "Calendar"]].map(([v, l]) => `<button aria-pressed="${v === view}" data-act="planView" data-v="${v}">${l}</button>`).join("")}</div>
        <div class="row"><label class="row small" for="hours">Hours per day <input id="hours" class="input num" style="width:76px" type="number" min="0.5" max="10" step="0.5" value="${p.dailyHours}" data-change="setHours"></label><button class="btn sm" data-act="missToday">${A.icon("refresh")}I can't study today</button></div>
      </div>
      <details class="card" style="margin-bottom:16px"><summary style="cursor:pointer;font-weight:600">How this plan is built</summary><div class="stack small" style="margin-top:10px">
        <p>Every concept's next ${plan.block}-minute block is worth <span class="mono">expected marks × (1 − mastery) × (e^(−(k−1)·25/τ) − e^(−k·25/τ))</span>, where τ grows with difficulty and with weak prerequisites. Each extra block is worth less than the last.</p>
        <p>Blocks are taken in order of value as long as every exam's deadline can still be met. Because each block is one unit of time with a deadline, this greedy choice is optimal for that part of the problem (it is a scheduling matroid). Blocks are then laid onto days with prerequisites first, at most 75 minutes per concept per day, and 15% of each day kept for spaced reviews at +1, +4 and +10 days.</p>
        <p>Courses where your target grade is at risk get a 1.25× weight; courses where it is already near-certain get 0.85×. On ${S.evalsCache ? S.evalsCache.planner[0].students : "simulated"} simulated students this plan beat a chapter-order plan by ${S.evalsCache ? pct(S.evalsCache.planner[0].lift) : "a wide margin"} in expected marks gained.</p>
      </div></details>
      ${body}` };
  };
  Object.assign(A.actions, {

  // ---------- Grades ----------
  A.views.grades = function () {
    const d = D(), p = P(), g = d.university.grading;
    const sel = S.ui.gradeCourse && p.courses.includes(S.ui.gradeCourse) ? S.ui.gradeCourse : p.courses[0];
    const pr = A.predict(sel), pp = A.predictPlanned(sel);
    // normal curves for the chart
    const W = 640, H = 200, padL = 36, padB = 26;
    const xs = (v) => padL + (v / 70) * (W - padL - 10);
    const pdf = (x, mu, sd) => Math.exp(-0.5 * ((x - mu) / sd) ** 2) / (sd * Math.sqrt(2 * Math.PI));
    const peak = Math.max(pdf(pr.mu, pr.mu, pr.sd), pdf(pp.mu, pp.mu, pp.sd));
    const ys = (v) => H - padB - (v / peak) * (H - padB - 14);
    const path = (mu, sd) => { let s = ""; for (let x = 0; x <= 70; x += 0.5) s += (x ? "L" : "M") + xs(x).toFixed(1) + " " + ys(pdf(x, mu, sd)).toFixed(1); return s; };
    const need = pr.need;
    return { title: "Grades", html: `
      ${A.head("Grades and targets", `Grading at ${esc(d.university.short)}: internal ${g.internal} + mid-sem ${g.mid} + end-sem ${g.endWeight} (the ${g.endPaper}-mark paper is scaled to ${g.endWeight}). Edit your marks and targets; everything recalculates.`)}
      <div class="table-wrap"><table><thead><tr><th>Course</th><th>Internal</th><th>Mid-sem</th><th>Target</th><th class="num">Need in end-sem</th><th class="num">Expected end-sem</th><th>Now</th><th>With plan</th></tr></thead><tbody>
      ${p.courses.map((code) => { const a = A.predict(code), b = A.predictPlanned(code); const mk = p.marks[code]; return `<tr ${code === sel ? 'style="background:var(--accent-soft)"' : ""}><td><button class="btn ghost sm" style="padding:0;height:auto;text-align:left;white-space:normal" data-act="gradeCourse" data-code="${code}">${esc(A.courseName(code))}</button></td>
        <td><input class="input num" style="width:66px" type="number" min="0" max="20" value="${mk.internal}" aria-label="${esc(A.courseName(code))} internal out of 20" data-change="setMark" data-code="${code}" data-k="internal"></td>

  // ---------- Ask (cited doubt solver) ----------
  function chatOf() { const id = S.session.id; return (S.chats[id] = S.chats[id] || []); }
  A.views.ask = function () {
    const d = D(), p = P(), chat = chatOf();
    const sel = S.ui.askSel != null ? chat[S.ui.askSel] : [...chat].reverse().find((m) => m.role === "bot");
    const suggestions = [];
    for (const code of p.courses.slice(0, 3)) { const r = A.map(code, p.profs[code]).rows[0]; suggestions.push(`Explain ${A.cname(r.id)}`); }
    suggestions.push(`How do I approach a derivation on ${A.cname(A.map(p.courses[3] || p.courses[0], p.profs[p.courses[3] || p.courses[0]]).rows[1].id)}?`);
    const after = () => { if (S.pendingAsk) { const q = S.pendingAsk; S.pendingAsk = null; A.ask(q); } const box = A.$("#msgs-end"); if (box) box.scrollIntoView({ block: "end" }); };
    const mode = S.flags.claude && A.sample ? "Claude writes the answer from your sources; Gradient then checks every sentence against what it cites." : "Answers are assembled from the most relevant sentences in your sources, each cited.";
    return { title: "Ask a doubt", after, html: `
      ${A.head("Ask a doubt", `Answers come only from notes and past papers for your ${p.courses.length} courses. ${mode}`)}
      <div class="chat">
        <div class="stack">
          <div class="msgs" aria-live="polite">${chat.length ? chat.map((m, i) => m.role === "user" ? `<div class="msg user">${esc(m.text)}</div>` : A.renderAnswer(m, i)).join("") : `<div class="card empty">${A.icon("chat")}<div><b>Ask anything from your syllabus.</b><br>Try one of these:</div><div class="row" style="justify-content:center">${suggestions.map((s) => `<button class="chip accent" style="cursor:pointer" data-act="askChip" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`}<div id="msgs-end"></div></div>
          <form class="composer" data-submit="askSubmit"><label class="sr" for="ask-q">Your question</label><textarea id="ask-q" name="q" class="input" placeholder="e.g. Why does BCNF need every determinant to be a candidate key?" rows="2"></textarea><button class="btn primary" type="submit" id="ask-btn">Ask</button></form>
        </div>
        <aside class="stack" aria-label="Sources">
          <div class="row-between"><h3>Sources</h3>${sel ? `<span class="tiny muted">for “${esc(sel.query.slice(0, 40))}${sel.query.length > 40 ? "…" : ""}”</span>` : ""}</div>
          ${sel && sel.sources && sel.sources.length ? sel.sources.map((s) => `<div class="source" id="src-${s.n}"><div class="row-between"><span class="id">S${s.n} · ${esc(s.label.title)}</span>${s.label.verified ? `<span class="chip good">${A.icon("check")}${s.doc.kind === "note" ? "Verified" : "Solved"}</span>` : ""}</div><div class="tiny muted" style="margin:2px 0 6px">${esc(s.label.sub)}</div><div>${esc(s.text)}</div></div>`).join("") : `<div class="panel small muted">Sources for each answer appear here. Click a citation like <span class="cite">S1</span> to jump to it.</div>`}
        </aside>
      </div>` };
  };
  A.renderAnswer = function (m, i) {
    if (m.pending) return `<div class="msg bot"><div class="row small muted"><span class="boot-step run" style="gap:8px"><i></i></span>${esc(m.pending)}</div></div>`;
    const d = D();
    const body = m.coverage === "none"
      ? `<p>${esc(m.notice || "Your course material does not cover this, so I won't guess.")}</p>${m.near && m.near.length ? `<p class="small muted">Closest topics in your courses: ${m.near.map((id) => `<button class="chip" style="cursor:pointer" data-act="concept" data-id="${id}">${esc(d.conceptById[id].name)}</button>`).join(" ")}</p>` : ""}`
      : m.sentences.map((s) => `<p><span class="${s.supported ? "" : "unsupported"}" ${s.supported ? "" : 'title="Not clearly supported by the cited source"'}>${esc(s.text)}</span>${s.cites.map((c) => `<button class="cite" data-act="cite" data-i="${i}" data-c="${c.slice(1)}" aria-label="Source ${c}">${c}</button>`).join("")}</p>`).join("");
    const meta = m.coverage === "none" ? "" : `<div class="row tiny muted" style="margin-top:10px;gap:8px">${m.mode === "claude" ? `<span class="chip accent">Written by Claude</span>` : `<span class="chip">Extractive</span>`}<span class="chip ${m.faith >= 0.9 ? "good" : m.faith >= 0.6 ? "warn" : "bad"}">${Math.round(m.faith * 100)}% of sentences supported</span>${m.coverage === "partial" ? `<span class="chip warn">Partial coverage</span>` : ""}${m.concepts.length ? `<span>Topics: ${m.concepts.map((id) => `<button class="btn ghost sm" style="height:auto;padding:0 2px" data-act="concept" data-id="${id}">${esc(d.conceptById[id].name)}</button>`).join(", ")}</span>` : ""}</div>${m.notice ? `<div class="tiny muted" style="margin-top:6px">${esc(m.notice)}</div>` : ""}`;
    return `<div class="msg bot">${body}${meta}</div>`;
  };
  A.ask = async function (q) {
    const d = D(), p = P(), chat = chatOf();
    if (!q.trim()) return;
    chat.push({ role: "user", text: q });
    const full = G.retrieve(d, S.KB, q, p.courses, { k: 12, blocked: S.KB.blocked });
    const ret = Object.assign({}, full, { results: G.pickSources(full) });
    const coverage = G.coverage(d, S.KB, q, full);
    const base = { role: "bot", query: q, concepts: ret.concepts.map((c) => c.id).slice(0, 3), coverage };
    // doubt-chat behaviour nudges mastery: asking about a concept signals it is not yet secure
    for (const c of base.concepts) if (p.mastery[c] != null) { p.askedConcepts[c] = (p.askedConcepts[c] || 0) + 1; p.mastery[c] = Math.max(0.02, p.mastery[c] * 0.98); }
    if (coverage === "none") {
      chat.push(Object.assign(base, { sentences: [], sources: [], faith: 1, near: ret.concepts.map((c) => c.id), notice: "Your course notes and past papers don't cover this question, so there is nothing to cite. Try rephrasing with the topic name, or ask your professor." }));
      S.ui.askSel = null; A.changed(); A.render(); return;
    }
    const sources = ret.results.map((r, i) => ({ n: i + 1, doc: r.doc, label: G.sourceLabel(d, S.KB, r.doc), text: G.sourceText(d, S.KB, r.doc) }));
    const ans = Object.assign(base, { sources, mode: "extractive" });
    if (S.flags.claude && A.sample) {
      ans.pending = "Thinking…"; chat.push(ans); S.ui.askSel = null; A.render();
      const btn = A.$("#ask-btn"); if (btn) btn.disabled = true;
      try {
        const prompt = G.buildAnswerPrompt(q, sources.map((s) => ({ label: s.label.title, text: s.text })), p.courses.map((c) => A.courseName(c)));
        const out = await A.sample.json(prompt, { cache: false });
        if (!out || !Array.isArray(out.sentences)) throw { code: "invalid_json" };
        if (out.coverage === "none" || !out.sentences.length) { ans.coverage = "none"; ans.near = base.concepts; ans.sentences = []; ans.notice = "Claude found that your sources don't answer this, so it did not guess."; }
        else {
          const v = G.verifyAnswer(out.sentences.map((s) => ({ text: String(s.text || ""), cites: (s.cites || []).map(String) })), sources);
          Object.assign(ans, { sentences: v.sentences, faith: v.faithfulness, citeAcc: v.citationAccuracy, mode: "claude", coverage: out.coverage === "partial" ? "partial" : ans.coverage });
          if (v.faithfulness < 1) ans.notice = "Underlined sentences could not be matched to their cited source. Check them before relying on them.";
        }
      } catch (e) {
        const sents = G.extractiveAnswer(d, S.KB, q, ret);
        const v = G.verifyAnswer(sents, sources);
        if (!sents.length) { ans.coverage = "none"; ans.near = base.concepts; }
        Object.assign(ans, { sentences: v.sentences, faith: v.faithfulness, mode: "extractive", notice: e && e.code === "not_granted" ? "Claude-written answers need your permission; showing the cited extract instead." : "Claude could not answer just now; showing the cited extract instead." });
        if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) A.sample = null;
      }
      delete ans.pending;
    } else {
      const sents = G.extractiveAnswer(d, S.KB, q, ret);
      const v = G.verifyAnswer(sents, sources);
      Object.assign(ans, { sentences: v.sentences, faith: v.faithfulness });
      if (!sents.length) Object.assign(ans, { coverage: "none", near: base.concepts, notice: "Your sources mention this topic but none of them explains it yet, so there is nothing to quote. The past questions are listed on the right." });
      chat.push(ans);
    }
    S.ui.askSel = null; A.changed(); A.render();
  };
  Object.assign(A.actions, {
    askSubmit: (f) => { const q = f.q.value; f.q.value = ""; A.ask(q); },
    askChip: (el) => A.ask(el.dataset.q),
    cite: (el) => {
      S.ui.askSel = +el.dataset.i; A.render();
      const t = A.$("#src-" + el.dataset.c); if (t) { t.classList.add("hl"); t.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    },
  });

  // ---------- Quiz ----------
  A.views.quiz = function () {
    const d = D(), p = P(), q = S.quiz;
    if (!S.flags.quizzes) return { title: "Quiz", html: `${A.head("Adaptive quiz")}<div class="banner warn">${A.icon("info")}<div>Quizzes are switched off by your administrator.</div></div>` };
    if (!q) {
      const sel = S.ui.quizCourse || "";
      const log = (p.quizLog || []).slice(-5).reverse();
      return { title: "Quiz", html: `
        ${A.head("Adaptive quiz", "Six questions built from your course graph, aimed at concepts where an answer will tell us the most and that carry the most marks. Every answer updates your mastery and the plan.")}
        <section class="card stack" style="max-width:640px">
          <label class="field"><span>Course</span><select class="input" data-change="quizCourseSel"><option value="">All my courses</option>${p.courses.map((c) => `<option value="${c}" ${sel === c ? "selected" : ""}>${esc(A.courseName(c))}</option>`).join("")}</select></label>
          <div class="small muted">Difficulty adapts: above 70% recent accuracy, wrong answers come from the same unit and are harder to tell apart.${p.recentAccuracy != null ? ` Your recent accuracy is ${pct(p.recentAccuracy)}.` : ""}</div>
          <button class="btn primary" data-act="quizStart" style="align-self:flex-start">Start quiz ${A.icon("arrow")}</button>
        </section>
        ${log.length ? `<section class="card" style="max-width:640px;margin-top:16px"><h3 style="margin-bottom:8px">Recent quizzes</h3>${log.map((l) => `<div class="row-between small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${new Date(l.at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}</span><span class="num">${l.score}/${l.n}</span></div>`).join("")}</section>` : ""}` };
    }
    if (q.i >= q.qs.length) {
      const score = q.answers.filter((a) => a.correct).length;
      return { title: "Quiz", html: `
        ${A.head(`You scored ${score} of ${q.qs.length}`, "Mastery changes below are already in your plan and grade forecast.")}
        <section class="card" style="max-width:720px"><div class="table-wrap"><table><thead><tr><th>Concept</th><th>Result</th><th class="num">Mastery</th></tr></thead><tbody>
        ${q.answers.map((a) => `<tr><td>${esc(A.cname(a.concept))}</td><td>${a.correct ? `<span class="chip good">Correct</span>` : `<span class="chip bad">Missed</span>`}</td><td class="num">${pct(a.before)} → ${pct(a.after)}</td></tr>`).join("")}
        </tbody></table></div>
        <div class="row" style="margin-top:14px"><button class="btn primary" data-act="quizAgain">Another quiz</button><a class="btn" href="#planner">See the updated plan</a></div></section>` };
    }
    const item = q.qs[q.i], ans = q.answers[q.i];
    return { title: "Quiz", html: `
      ${A.head(`Question ${q.i + 1} of ${q.qs.length}`, `${esc(A.courseName(item.course))} · ${item.difficulty === "hard" ? "harder distractors" : "standard"}`)}
      <section class="card stack" style="max-width:760px">
        <h2 style="font-size:19px">${esc(item.prompt)}</h2>
        <div class="stack" style="gap:8px" role="group" aria-label="Answer options">${item.options.map((o, i) => { let cls = ""; if (ans) { if (o.id === item.answer) cls = "right"; else if (o.id === ans.picked) cls = "wrong"; } return `<button class="opt ${cls}" data-act="quizPick" data-id="${o.id}" ${ans ? "disabled" : ""}><b>${"ABCD"[i]}</b><span>${esc(o.text)}</span></button>`; }).join("")}</div>
        ${ans ? `<div class="banner ${ans.correct ? "good" : "bad"}">${A.icon(ans.correct ? "check" : "x")}<div><b>${ans.correct ? "Correct." : "Not quite."}</b> ${esc(A.cname(item.answer))}: ${esc(d.conceptById[item.answer].gist)}. Mastery ${pct(ans.before)} → ${pct(ans.after)}.</div></div>
        <button class="btn primary" data-act="quizNext" style="align-self:flex-start">${q.i + 1 === q.qs.length ? "See results" : "Next question"} ${A.icon("arrow")}</button>` : ""}
      </section>` };
  };
  Object.assign(A.actions, {
    quizCourseSel: (el) => { S.ui.quizCourse = el.value; },
    quizStart: () => { const p = P(); const rng = new G.Rng("quiz:" + Date.now()); S.quiz = { qs: G.makeQuiz(D(), p, rng, 6, S.ui.quizCourse || null), i: 0, answers: [] }; A.render(); },
    quizPick: (el) => {
      const p = P(), q = S.quiz, item = q.qs[q.i];
      const correct = el.dataset.id === item.answer;
      const before = p.mastery[item.concept];
      p.mastery[item.concept] = G.bktUpdate(before, correct);
      if (correct) p.stability[item.concept] = (p.stability[item.concept] || 3) * 1.6;
      q.answers[q.i] = { concept: item.concept, picked: el.dataset.id, correct, before, after: p.mastery[item.concept] };
      p.recentAccuracy = p.recentAccuracy == null ? (correct ? 1 : 0) : p.recentAccuracy * 0.8 + (correct ? 0.2 : 0);
      A.changed(); A.render();
    },
    quizNext: () => {
      const q = S.quiz; q.i++;
      if (q.i >= q.qs.length) { const p = P(); (p.quizLog = p.quizLog || []).push({ at: new Date().toISOString(), n: q.qs.length, score: q.answers.filter((a) => a.correct).length }); A.notify(`Quiz done: ${q.answers.filter((a) => a.correct).length}/${q.qs.length}. Your plan was rebuilt with the new mastery.`); A.changed(); }
      A.render();
    },
    quizAgain: () => { S.quiz = null; A.render(); },
  });

  // ---------- Panic mode ----------
  A.views.panic = function () {
    const d = D(), p = P();
    if (!S.flags.panic) return { title: "Panic mode", html: `${A.head("Panic mode")}<div class="banner warn">${A.icon("info")}<div>Panic mode is switched off by your administrator.</div></div>` };
    const upcoming = p.courses.slice().sort((a, b) => p.examDates[a].localeCompare(p.examDates[b]));
    const code = S.ui.panicCourse && p.courses.includes(S.ui.panicCourse) ? S.ui.panicCourse : upcoming[0];
    const hours = S.ui.panicHours || 6;
    const r = A.cached(`panic:${code}:${hours}`, () => G.panic(d, S.KB, p, code, hours));
    return { title: "Panic mode", html: `
      ${A.head("Panic mode", "Short on time? This is the triage list: the concepts that return the most marks per minute for your professor's paper, with a one-page summary from verified notes.")}

          <div class="table-wrap"><table><thead><tr><th>Scenario</th><th class="num">Gradient</th><th class="num">Chapter order</th><th class="num">Lift</th></tr></thead><tbody>${R.planner.map((p) => `<tr><td class="small">${esc(p.scenario)}</td><td class="num">+${fmt1(p.gradient)}</td><td class="num">+${fmt1(p.chapterOrder)}</td><td class="num">${pct(p.lift)}</td></tr>`).join("")}</tbody></table></div><p class="tiny muted">Expected marks gained across all courses. Gradient beats chapter order for ${pct(Math.min(...R.planner.map((p) => p.winRate)))} of simulated students (lowest of the two scenarios).</p></section>
        <section class="card stack"><h2>Retrieval</h2><p class="small muted">Labelled queries; relevant documents come from the generator's ground truth.</p>
          <div class="table-wrap"><table><thead><tr><th>Query set</th><th class="num">Recall@5</th><th class="num">MRR</th></tr></thead><tbody>${[["Named (“explain X”)", R.retrieval.named], ["Paraphrased (gist words only)", R.retrieval.paraphrase]].map(([l, x]) => `<tr><td class="small">${l}<br><span class="faint">concept-first / plain BM25</span></td><td class="num">${pct(x.conceptFirst.recall5)} / ${pct(x.bm25.recall5)}</td><td class="num">${x.conceptFirst.mrr.toFixed(2)} / ${x.bm25.mrr.toFixed(2)}</td></tr>`).join("")}</tbody></table></div></section>
        <section class="card stack"><h2>Ingestion</h2><div class="table-wrap"><table><tbody>${row("Dedup precision", pct(R.dedup.precision), `${R.dedup.truePairs} true duplicates`)}${row("Dedup recall", pct(R.dedup.recall), "")}${row("Concept tagging precision", pct(R.tagging.precision), `${R.tagging.chunks.toLocaleString("en-IN")} chunks`)}${row("Spam caught", pct(R.moderation.spamCaught), `${R.moderation.spam} spam uploads`)}${row("Injection caught", pct(R.moderation.injectionCaught), `${R.moderation.injection} injection uploads`)}${row("False flags on clean notes", pct(R.moderation.falsePositiveRate), "")}</tbody></table></div></section>
        <section class="card stack"><h2>Security and answers</h2><div class="table-wrap"><table><tbody>${row("Injected chunks in the index", R.security.injectedChunksIndexed, "")}${row("Out-of-scope retrieval results", `${R.security.outOfScopeResults} of ${R.security.scopedQueries} queries`, "students only search their own courses")}${row("Adversarial prompts that surfaced injected text", `${R.security.adversarialLeaks} of ${R.security.adversarialQueries}`, "")}${row("Extractive answer faithfulness", pct(R.faithfulness.faithfulness), `${R.faithfulness.answers} answers, ${R.faithfulness.abstained} abstained for lack of evidence`)}${row("Citation accuracy", pct(R.faithfulness.citationAccuracy), "")}${row("Prerequisite graph", R.dag.acyclic ? "acyclic" : "has a cycle", `${R.dag.edges} edges`)}</tbody></table></div></section>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn" data-act="rerunEvals">${A.icon("refresh")}Run again</button></div>` };
  };
  A.actions.rerunEvals = () => { S.evalsFull = null; A.render(); };
})(G);


(function () {
  G.app.boot();
  // Claude-written answers light up only where the viewer can grant the sample capability
  (async function () {
    try {
      if (window.claude && window.claude.use) {
        const s = await window.claude.use("sample");
        if (s) { G.app.sample = s; if (G.app.route() === "ask") G.app.render(); }
      }
    } catch (e) { /* stay extractive */ }
  })();
})();

</script>
